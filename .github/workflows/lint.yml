name: PowerShell lint

on:
  push:
    paths: ['scripts/**', 'config/**', 'PSScriptAnalyzerSettings.psd1', '.github/workflows/lint.yml']
  pull_request:
    paths: ['scripts/**', 'config/**', 'PSScriptAnalyzerSettings.psd1', '.github/workflows/lint.yml']

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results) { throw "$($results.Count) PSScriptAnalyzer finding(s)" }
      - name: Validate configuration files
        shell: pwsh
        run: |
          Import-Module ./scripts/LabConfig.psm1 -Force
          $sections = 'Domain', 'DomainController', 'Client', 'OUs', 'Groups', 'SalesRestrictionsGpo', 'Laps'
          Get-ChildItem ./config/*.psd1 | ForEach-Object {
            Import-LabConfig -Path $_.FullName -Required $sections | Out-Null
            "OK  $($_.Name)"
          }
