name: PowerShell lint

on:
  push:
    paths: ['scripts/**', 'PSScriptAnalyzerSettings.psd1', '.github/workflows/lint.yml']
  pull_request:
    paths: ['scripts/**', 'PSScriptAnalyzerSettings.psd1', '.github/workflows/lint.yml']

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results) { throw "$($results.Count) PSScriptAnalyzer finding(s)" }
